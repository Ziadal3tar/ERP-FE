<div
  class="modal-backdrop"
  (click)="close()"
>

  <section
    class="operation-modal"
    (click)="$event.stopPropagation()"
  >

    <!-- Header -->

    <header class="modal-header">

      <div class="header-icon">

        <i class="bi bi-boxes"></i>

      </div>

      <div>

        <span>
          INVENTORY
        </span>

        <h2>
          Stock Operation
        </h2>

        <p>
          Update inventory quantities across warehouses.
        </p>

      </div>

      <button
        type="button"
        class="close-button"
        (click)="close()"
        [disabled]="saving()"
      >

        <i class="bi bi-x-lg"></i>

      </button>

    </header>


    @if (loading()) {

      <div class="loading-state">

        <div class="spinner"></div>

        Preparing operation...

      </div>

    } @else {

      <!-- Operation Type -->

      <div class="operation-tabs">

        <button
          type="button"
          [class.active]="operation === 'IN'"
          class="in"
          (click)="changeOperation('IN')"
        >

          <i class="bi bi-box-arrow-in-down"></i>

          Stock In

        </button>


        <button
          type="button"
          [class.active]="operation === 'OUT'"
          class="out"
          (click)="changeOperation('OUT')"
        >

          <i class="bi bi-box-arrow-up"></i>

          Stock Out

        </button>


        <button
          type="button"
          [class.active]="operation === 'TRANSFER'"
          class="transfer"
          (click)="changeOperation('TRANSFER')"
        >

          <i class="bi bi-arrow-left-right"></i>

          Transfer

        </button>

      </div>


      @if (error()) {

        <div class="error-box">

          <i class="bi bi-exclamation-circle"></i>

          <span>
            {{ error() }}
          </span>

        </div>

      }


      <div class="form-body">

        <!-- Product -->

        <div class="field full">

          <label>
            Product
          </label>

          <select
            [(ngModel)]="productId"
          >

            <option value="">
              Select product
            </option>

            @for (
              product of products();
              track product._id
            ) {

              <option
                [value]="product._id"
              >

                {{ product.name }}
                ·
                {{ product.sku }}

              </option>

            }

          </select>

        </div>


        @if (
          operation === 'TRANSFER'
        ) {

          <!-- From -->

          <div class="field">

            <label>
              From Warehouse
            </label>

            <select
              [(ngModel)]="fromWarehouseId"
            >

              <option value="">
                Select source
              </option>

              @for (
                warehouse of warehouses();
                track warehouse._id
              ) {

                <option
                  [value]="warehouse._id"
                >

                  {{ warehouse.name }}
                  ·
                  {{ warehouse.code }}

                </option>

              }

            </select>

          </div>


          <!-- To -->

          <div class="field">

            <label>
              To Warehouse
            </label>

            <select
              [(ngModel)]="toWarehouseId"
            >

              <option value="">
                Select destination
              </option>

              @for (
                warehouse of availableDestinationWarehouses;
                track warehouse._id
              ) {

                <option
                  [value]="warehouse._id"
                >

                  {{ warehouse.name }}
                  ·
                  {{ warehouse.code }}

                </option>

              }

            </select>

          </div>

        } @else {

          <!-- Warehouse -->

          <div class="field full">

            <label>
              Warehouse
            </label>

            <select
              [(ngModel)]="warehouseId"
            >

              <option value="">
                Select warehouse
              </option>

              @for (
                warehouse of warehouses();
                track warehouse._id
              ) {

                <option
                  [value]="warehouse._id"
                >

                  {{ warehouse.name }}
                  ·
                  {{ warehouse.code }}

                </option>

              }

            </select>

          </div>

        }


        <!-- Quantity -->

        <div class="field">

          <label>
            Quantity
          </label>

          <input
            type="number"
            min="0.01"
            step="0.01"
            [(ngModel)]="quantity"
            placeholder="0"
          />

        </div>


        <!-- Reference -->

        <div class="field">

          <label>
            Reference
          </label>

          <input
            type="text"
            [(ngModel)]="reference"
            maxlength="100"
            placeholder="PO-2026-001"
          />

        </div>


        <!-- Notes -->

        <div class="field full">

          <label>
            Notes
          </label>

          <textarea
            rows="4"
            [(ngModel)]="notes"
            maxlength="500"
            placeholder="Optional operation notes..."
          ></textarea>

        </div>

      </div>


      <!-- Footer -->

      <footer class="modal-footer">

        <button
          type="button"
          class="secondary-button"
          (click)="close()"
          [disabled]="saving()"
        >
          Cancel
        </button>


        <button
          type="button"
          class="primary-button"
          [disabled]="saving()"
          (click)="submit()"
        >

          @if (saving()) {

            <span class="button-spinner"></span>

            Processing...

          } @else {

            <i class="bi bi-check-lg"></i>

            Confirm Operation

          }

        </button>

      </footer>

    }

  </section>

</div>
