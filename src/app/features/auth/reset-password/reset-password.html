<div class="reset-page">

    <div class="card">

        <div class="icon">

            🔑

        </div>

        <h2>Create New Password</h2>

        <p>

            Your new password must be different from your old password.

        </p>

        <form
            [formGroup]="resetForm"
            (ngSubmit)="submit()">

            <div class="form-group">

                <label>New Password</label>

                <input
                    type="password"
                    formControlName="password"
                    placeholder="Enter new password">

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    formControlName="confirmPassword"
                    placeholder="Confirm password">

            </div>

            @if(resetForm.errors?.['passwordMismatch'] &&
            f.confirmPassword.touched){

            <small>

                Passwords do not match

            </small>

            }

            @if(successMessage){

            <div class="success">

                {{successMessage}}

            </div>

            }

            @if(errorMessage){

            <div class="error">

                {{errorMessage}}

            </div>

            }

            <button
                type="submit"
                [disabled]="loading">

                @if(!loading){

                Reset Password

                }@else{

                Saving...

                }

            </button>

        </form>

        <a routerLink="/login">

            Back to Login

        </a>

    </div>

</div>
