<header class="app-header">


  <!-- =====================================================
       Left
       ===================================================== -->

  <div class="header-left">


    <button
      type="button"
      class="header-icon-button desktop-toggle"
      aria-label="Toggle sidebar"
      (click)="onDesktopToggle()"
    >

      <i class="bi bi-list"></i>

    </button>


    <button
      type="button"
      class="header-icon-button mobile-toggle"
      aria-label="Open menu"
      (click)="onMobileToggle()"
    >

      <i class="bi bi-list"></i>

    </button>


    <div class="page-heading">

      <h1>
        {{ pageTitle() }}
      </h1>

      <span>
        Manage your business efficiently
      </span>

    </div>

  </div>


  <!-- =====================================================
       Right
       ===================================================== -->

  <div class="header-right">


    <!-- Search -->

    <div class="header-search">

      <i class="bi bi-search"></i>

      <input
        type="search"
        placeholder="Search..."
        aria-label="Search"
      />

      <span class="search-shortcut">
        /
      </span>

    </div>


    <!-- =================================================
         Notifications
         ================================================= -->

    <button
      type="button"
      class="header-icon-button notification-button"

      [attr.aria-label]="
        notificationService.unreadCount() > 0
          ? 'Notifications, ' +
            notificationService.unreadCount() +
            ' unread'
          : 'Notifications'
      "

      (click)="onNotificationsClick()"
    >

      <i class="bi bi-bell"></i>


      @if (
        notificationService.unreadCount() > 0
      ) {

        <span class="notification-badge">

          {{
            notificationService.unreadCount() > 99
              ? '99+'
              : notificationService.unreadCount()
          }}

        </span>

      }

    </button>


    <!-- Divider -->

    <div class="header-divider"></div>


    <!-- =================================================
         User
         ================================================= -->

    <div class="user-menu-wrapper">


      <button
        type="button"
        class="user-menu"

        [attr.aria-expanded]="
          userMenuOpen()
        "

        (click)="toggleUserMenu()"
      >

        <div class="user-avatar">

          @if (user()?.avatar) {

            <img
              [src]="user()?.avatar"
              [alt]="userName"
            />

          } @else {

            {{ userInitials }}

          }

        </div>


        <div class="user-info">

          <strong>
            {{ userName }}
          </strong>

          <span>
            {{ userRole }}
          </span>

        </div>


        <i
          class="bi bi-chevron-down user-arrow"
          [class.rotated]="
            userMenuOpen()
          "
        ></i>

      </button>


      @if (userMenuOpen()) {

        <div class="user-dropdown">


          <!-- User Header -->

          <div class="dropdown-user">

            <div class="dropdown-avatar">

              @if (user()?.avatar) {

                <img
                  [src]="user()?.avatar"
                  [alt]="userName"
                />

              } @else {

                {{ userInitials }}

              }

            </div>


            <div>

              <strong>
                {{ userName }}
              </strong>

              <span>
                {{ userEmail }}
              </span>

            </div>

          </div>


          <div class="dropdown-divider"></div>


          <!-- Profile -->

          <button
            type="button"
            class="dropdown-item"
            (click)="openProfile()"
          >

            <span class="dropdown-item-icon blue">

              <i class="bi bi-person"></i>

            </span>

            <span class="dropdown-item-content">

              <strong>
                My Profile
              </strong>

              <small>
                View and edit your profile
              </small>

            </span>

          </button>


          <!-- Notifications -->

          <button
            type="button"
            class="dropdown-item"
            (click)="onNotificationsClick()"
          >

            <span class="dropdown-item-icon purple">

              <i class="bi bi-bell"></i>

            </span>

            <span class="dropdown-item-content">

              <strong>
                Notifications
              </strong>

              <small>
                View your notifications
              </small>

            </span>


            @if (
              notificationService.unreadCount() > 0
            ) {

              <span class="dropdown-count">

                {{
                  notificationService.unreadCount()
                }}

              </span>

            }

          </button>


          <!-- Change Password -->

          <button
            type="button"
            class="dropdown-item"
            (click)="changePassword()"
          >

            <span class="dropdown-item-icon orange">

              <i class="bi bi-key"></i>

            </span>

            <span class="dropdown-item-content">

              <strong>
                Change Password
              </strong>

              <small>
                Update your password
              </small>

            </span>

          </button>


          <div class="dropdown-divider"></div>


          <!-- Logout -->

          <button
            type="button"
            class="dropdown-item logout-item"
            (click)="logout()"
          >

            <span class="dropdown-item-icon red">

              <i class="bi bi-box-arrow-right"></i>

            </span>

            <span class="dropdown-item-content">

              <strong>
                Logout
              </strong>

              <small>
                Sign out of your account
              </small>

            </span>

          </button>


        </div>

      }

    </div>

  </div>

</header>
